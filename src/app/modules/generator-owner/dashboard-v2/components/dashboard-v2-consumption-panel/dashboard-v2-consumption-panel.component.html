<p-card header="Consumption">
    @if (loading && !data) {
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
            @for (i of [1, 2, 3, 4, 5, 6]; track i) {
                <p-skeleton height="6rem" borderRadius="0.75rem"></p-skeleton>
            }
        </div>
    } @else if (!data) {
        <p-message severity="info" text="No consumption data available."></p-message>
    } @else {
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
            @for (metric of metrics; track metric.label) {
                <div class="consumption-tile consumption-{{ metric.severity }}">
                    <div class="flex items-center justify-between gap-2">
                        <div class="text-sm text-color-secondary font-semibold">{{ metric.label }}</div>
                        <i [class]="metric.icon"></i>
                    </div>
                    <div class="text-2xl font-extrabold mt-2">{{ metric.value }}</div>
                </div>
            }
        </div>
    }
</p-card>
