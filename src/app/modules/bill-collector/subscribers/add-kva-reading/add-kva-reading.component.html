<div class="card !p-3">
    <div class="mx-auto max-w-xl">
        <!-- Page header -->
        <div class="mb-4 flex items-center gap-2">
            <p-button
                icon="pi pi-arrow-left"
                severity="primary"
                text
                aria-label="Back to subscribers"
                [disabled]="readingEditorBusy"
                (onClick)="goBack()"
            ></p-button>

            <div class="min-w-0 flex-1">
                <div class="text-lg font-semibold leading-tight">
                    Add KWH Reading
                </div>

                <div class="text-sm leading-tight text-color-secondary">
                    Enter the subscriber's new meter reading
                </div>
            </div>
        </div>

        @if (subscriberId > 0) {
            <app-kva-reading-editor
                [subscriberId]="subscriberId"
                [showCancel]="true"
                [stickyActions]="true"
                (busyChange)="readingEditorBusy = $event"
                (saved)="onReadingSaved($event)"
                (cancelled)="goBack()"
            ></app-kva-reading-editor>
        }
    </div>
</div>
